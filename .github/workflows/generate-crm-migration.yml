name: Generate CRM migration

on:
  push:
    branches:
      - "foundation/bootstrap"
    paths:
      - ".github/workflows/generate-crm-migration.yml"
      - "supabase/drafts/crm_core.sql"

permissions:
  contents: write

concurrency:
  group: crm-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate CLI migration file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Create migration using Supabase CLI
        id: migration
        shell: bash
        run: |
          set -euo pipefail

          existing="$(find supabase/migrations -maxdepth 1 -type f -name '*_crm_customer_core.sql' -print -quit)"
          if [ -n "$existing" ]; then
            echo "CRM canonical migration already exists: $existing"
            echo "path=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          supabase --version
          supabase migration new crm_customer_core

          migration="$(find supabase/migrations -maxdepth 1 -type f -name '*_crm_customer_core.sql' -print | sort | tail -n 1)"
          test -n "$migration"
          cp supabase/drafts/crm_core.sql "$migration"

          echo "path=$migration" >> "$GITHUB_OUTPUT"
          echo "Generated $migration"

      - name: Commit generated migration to development branch
        if: steps.migration.outputs.path != ''
        shell: bash
        env:
          MIGRATION_PATH: ${{ steps.migration.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATION_PATH"
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "db(crm): generate canonical customer core migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
