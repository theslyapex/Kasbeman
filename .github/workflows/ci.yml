name: Kasbeman CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasbeman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kasbeman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate SQL dollar-quote delimiters
        run: node scripts/check-sql-delimiters.mjs

      - name: Validate sales/inventory SQL security structure
        run: node scripts/check-sales-inventory-security.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run PostgreSQL 17 schema and tenant-isolation tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: kasbeman_test
        run: bash scripts/test-postgres-schema.sh

      - name: vinext compatibility scan (non-migrating)
        working-directory: apps/web
        run: pnpm dlx vinext check

      - name: TypeScript validation
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Production build
        run: pnpm build
