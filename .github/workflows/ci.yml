name: Kasbeman CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate SQL dollar-quote delimiters
        run: node scripts/check-sql-delimiters.mjs

      - name: Validate sales/inventory SQL security structure
        run: node scripts/check-sales-inventory-security.mjs

      - name: vinext compatibility scan (non-migrating)
        working-directory: apps/web
        run: pnpm dlx vinext check

      - name: TypeScript validation
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Production build
        run: pnpm build
