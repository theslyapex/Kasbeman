name: One-time FK index migration generator

on:
  push:
    branches:
      - foundation/bootstrap
    paths:
      - .github/workflows/temporary-create-fk-index-migration.yml

permissions:
  contents: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasbeman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kasbeman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/bootstrap
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Generate migration with Supabase CLI
        id: migration
        shell: bash
        run: |
          supabase migration new add_missing_fk_indexes
          migration="$(find supabase/migrations -maxdepth 1 -type f -name '*_add_missing_fk_indexes.sql' -print -quit)"
          test -n "$migration"
          echo "path=$migration" >> "$GITHUB_OUTPUT"
          cat > "$migration" <<'SQL'
          -- Candidate-only performance migration based on the 2026-11-28
          -- read-only Supabase advisor and catalog review.
          -- Do not apply to the hosted project without separate approval.

          begin;

          create index business_invitations_invited_by_idx
            on public.business_invitations (invited_by);

          create index businesses_created_by_idx
            on public.businesses (created_by);

          create index member_role_assignments_assigned_by_idx
            on public.member_role_assignments (assigned_by);

          create index member_role_assignments_branch_fk_idx
            on public.member_role_assignments (business_id, branch_id);

          create index member_role_assignments_role_fk_idx
            on public.member_role_assignments (business_id, role_id);

          create index roles_created_by_idx
            on public.roles (created_by);

          commit;
          SQL

      - name: Add catalog assertions for the six FK indexes
        run: |
          cat > supabase/tests/fk-index-smoke.sql <<'SQL'
          DO $test$
          DECLARE
            v_missing text;
          BEGIN
            SELECT string_agg(e.index_name, ', ' ORDER BY e.index_name)
            INTO v_missing
            FROM (VALUES
              ('business_invitations_invited_by_idx', 'business_invitations', ARRAY['invited_by']::text[]),
              ('businesses_created_by_idx', 'businesses', ARRAY['created_by']::text[]),
              ('member_role_assignments_assigned_by_idx', 'member_role_assignments', ARRAY['assigned_by']::text[]),
              ('member_role_assignments_branch_fk_idx', 'member_role_assignments', ARRAY['business_id','branch_id']::text[]),
              ('member_role_assignments_role_fk_idx', 'member_role_assignments', ARRAY['business_id','role_id']::text[]),
              ('roles_created_by_idx', 'roles', ARRAY['created_by']::text[])
            ) AS e(index_name, table_name, expected_columns)
            WHERE NOT EXISTS (
              SELECT 1
              FROM pg_class idx
              JOIN pg_index ix ON ix.indexrelid = idx.oid
              JOIN pg_class tbl ON tbl.oid = ix.indrelid
              CROSS JOIN LATERAL (
                SELECT array_agg(a.attname ORDER BY k.ord) AS columns
                FROM unnest(ix.indkey) WITH ORDINALITY AS k(attnum, ord)
                JOIN pg_attribute a
                  ON a.attrelid = tbl.oid
                 AND a.attnum = k.attnum
                WHERE k.ord <= ix.indnkeyatts
              ) actual
              WHERE idx.relname = e.index_name
                AND tbl.relname = e.table_name
                AND ix.indisvalid
                AND actual.columns = e.expected_columns
            );

            IF v_missing IS NOT NULL THEN
              RAISE EXCEPTION 'Missing or malformed FK indexes: %', v_missing;
            END IF;
          END;
          $test$;
          SQL

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/test-postgres-schema.sh")
          s = p.read_text()
          migration = "${{ steps.migration.outputs.path }}"
          needle = "  -f supabase/drafts/sales_inventory_core.sql \\\n"
          assert needle in s, "Could not locate sales/inventory migration insertion point"
          s = s.replace(needle, f"  -f {migration} \\\n" + needle, 1)
          ending = "  -f supabase/tests/membership-invitation-smoke.sql\n"
          assert ending in s, "Could not locate smoke-test insertion point"
          s = s.replace(ending, "  -f supabase/tests/membership-invitation-smoke.sql \\\n  -f supabase/tests/fk-index-smoke.sql\n", 1)
          p.write_text(s)
          PY

      - name: Validate SQL delimiters
        run: node scripts/check-sql-delimiters.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run PostgreSQL 17 schema and security tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: kasbeman_test
        run: |
          bash scripts/test-postgres-schema.sh
          bash scripts/test-postgres-concurrency.sh

      - name: Record verified candidate and remove one-time workflow
        shell: bash
        run: |
          cat >> docs/PROJECT-ROADMAP.md <<'EOF'

          ## ایندکس‌گذاری کلیدهای خارجی (۲۰۲۶-۱۱-۲۸)
          - بررسی read-only کاتالوگ PostgreSQL و Advisor تأیید کرد شش FK فاقد ایندکس پوششی هستند.
          - یک migration کاندید با Supabase CLI v3.4.0 تولید شد؛ سه ایندکس تک‌ستونی و دو ایندکس مرکب برای رابطه‌های چندستونی به‌همراه ایندکس roles.created_by.
          - آزمون PostgreSQL 17، ترتیب ستون‌های هر شش ایندکس را از کاتالوگ بررسی می‌کند.
          - migration فقط در مخزن و محیط آزمایشی است؛ روی پروژه میزبانی‌شده اجرا نشده است.
          - هشدار نبود Policy برای private.authorization_audit_log با توجه به ACL محدود به مالک دیتابیس، بدون اعطای دسترسی جدید باقی می‌ماند.
          - public.create_business همچنان RPC ثبت کسب‌وکار برای کاربران واردشده است؛ اجرای آن برای anon و PUBLIC بسته است. هشدار Advisor به‌عنوان مورد باز برای آزمون‌های امنیتی و کنترل سوءاستفاده ثبت شد.
          EOF
          git rm .github/workflows/temporary-create-fk-index-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.migration.outputs.path }}" supabase/tests/fk-index-smoke.sql scripts/test-postgres-schema.sh docs/PROJECT-ROADMAP.md
          git commit -m "perf(db): add missing foreign key indexes"
          git push origin HEAD:foundation/bootstrap
