name: Generate Supabase migration scaffolds

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - ".github/workflows/generate-supabase-migration-scaffolds.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.4.0

      - name: Verify CLI and migration commands
        run: |
          supabase --version
          supabase init --help
          supabase migration new --help

      - name: Initialize local Supabase project config
        run: supabase init

      - name: Generate ordered migration scaffolds
        run: |
          supabase migration new rbac_role_assignment_hardening
          sleep 1
          supabase migration new membership_invitation_ownership_hardening
          find supabase/migrations -maxdepth 1 -type f -name '*_rbac_role_assignment_hardening.sql' -print
          find supabase/migrations -maxdepth 1 -type f -name '*_membership_invitation_ownership_hardening.sql' -print

      - name: Remove one-time workflow and commit scaffolds
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-supabase-migration-scaffolds.yml
          git add -A supabase/
          git commit -m "chore(db): generate Supabase migration scaffolds"
          git push origin "HEAD:${BRANCH}"
